name: DiGA Monitor

on:
  workflow_dispatch:
    inputs:
      notification_test:
        description: "Send notification test email"
        required: false
        default: "false"
  repository_dispatch:
    types: [scheduled-scan]
  schedule:
    - cron: "0 6,9,12,15,18 * * *"
      timezone: "Europe/Zurich"

concurrency:
  group: diga-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check notification configuration
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          missing=()
          for name in SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO DASHBOARD_URL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "::notice::Notification configuration complete."
          else
            echo "::notice::Notification configuration incomplete. Missing: ${missing[*]}"
          fi

      - name: Run notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python -m src.main notify-test

      - name: Diagnose R2 configuration metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.notification_test != 'true' }}
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.S3_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'diga-monitor' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os

          for name in (
              "R2_ENDPOINT",
              "R2_BUCKET_NAME",
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
          ):
              value = os.getenv(name)
              present = value is not None and value != ""
              length = len(value) if value is not None else 0
              has_lf = "\n" in value if value is not None else False
              has_cr = "\r" in value if value is not None else False
              boundary_whitespace = value != value.strip() if value is not None else False
              print(
                  f"::notice::{name} metadata: present={present} length={length} "
                  f"contains_lf={has_lf} contains_cr={has_cr} "
                  f"boundary_whitespace={boundary_whitespace}"
              )
          PY

      - name: Run DiGA monitor
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.notification_test != 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DIGA_API_TOKEN: ${{ secrets.DIGA_API_TOKEN }}
          DIGA_RENDER_CHANGED_ENTRIES: "true"
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.S3_ENDPOINT }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'diga-monitor' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
          R2_ARCHIVE_REQUIRED: "true"
        run: python -m src.main run --notify

      - name: Validate monitoring outputs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.notification_test != 'true' }}
        run: python scripts/monitoring_health_check.py --require-current-run --max-snapshot-age-hours 6

      - name: Commit and push monitoring outputs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.notification_test != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for path in data/baseline/current_snapshot.json outputs/changes outputs/scan_history.json outputs/content_section_dry_run data/rendered_structure/latest data/rendered_structure/history; do
            if [ -e "$path" ]; then
              git add -f "$path"
            else
              echo "Monitoring output path not present, skipping: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "::error::No monitoring changes to commit after a normal monitor run. A successful scan must persist the operational baseline and scan_history entry."
            exit 1
          fi

          git commit -m "Update DiGA monitoring data"
          git pull --rebase origin main
          git push origin main
          python scripts/monitoring_health_check.py --verify-head --max-snapshot-age-hours 6
