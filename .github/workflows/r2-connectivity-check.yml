name: R2 Connectivity Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Connectivity check or verified legacy-history migration"
        required: true
        default: connectivity
        type: choice
        options:
          - connectivity
          - legacy-history-migration

permissions:
  contents: read

jobs:
  verify-r2:
    if: inputs.mode == 'connectivity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 client dependency
        run: python -m pip install "boto3>=1.35.0"

      - name: Verify R2 connectivity and permissions
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.S3_ENDPOINT }}
          R2_BUCKET_NAME: diga-monitor
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
          R2_ARCHIVE_REQUIRED: "true"
        run: python -m scripts.r2_connectivity_check

  migrate-legacy-history:
    if: inputs.mode == 'legacy-history-migration'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository without legacy snapshot checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/snapshots/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests before migration
        run: python -m unittest discover -s tests

      - name: Backfill, migrate, verify, and restore in isolation
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.S3_ENDPOINT }}
          R2_BUCKET_NAME: diga-monitor
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
        run: python -m scripts.legacy_history_migration --backfill --execute-r2

      - name: Commit verified manifest and event contexts
        run: |
          if git diff --quiet -- outputs/changes data/audit/legacy_history_manifest.json; then
            echo "Migration outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/changes data/audit/legacy_history_manifest.json
          git commit -m "Backfill and verify legacy history"
          git push
