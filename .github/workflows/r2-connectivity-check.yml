name: R2 Connectivity Check

on:
  push:
    branches:
      - codex/legacy-history-cleanup-prep
  workflow_dispatch:
    inputs:
      mode:
        description: "Connectivity check or verified legacy-history migration"
        required: true
        default: connectivity
        type: choice
        options:
          - connectivity
          - tests
          - legacy-history-migration

permissions:
  contents: read

jobs:
  tests:
    if: inputs.mode == 'tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without legacy snapshot checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/snapshots/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

  verify-r2:
    if: inputs.mode == 'connectivity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 client dependency
        run: python -m pip install "boto3>=1.35.0"

      - name: Verify R2 connectivity and permissions
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.S3_ENDPOINT }}
          R2_BUCKET_NAME: diga-monitor
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
          R2_ARCHIVE_REQUIRED: "true"
        run: python -m scripts.r2_connectivity_check

  migrate-legacy-history:
    if: github.event_name == 'push' || inputs.mode == 'legacy-history-migration'
    concurrency:
      group: r2-legacy-history-migration
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require a non-main pull-request branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$TARGET_REF" = "main" ]; then
            echo "::error::Legacy migration must run from a pull-request branch, never main."
            exit 1
          fi
          pr_count="$(gh api "repos/$REPOSITORY/pulls?head=${REPOSITORY%%/*}:$TARGET_REF&base=main&state=open" --jq 'length')"
          if [ "$pr_count" -lt 1 ]; then
            echo "::error::Branch must have an open pull request against main."
            exit 1
          fi

      - name: Check out repository without legacy snapshot checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/snapshots/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests before migration
        run: python -m unittest discover -s tests

      - name: Backfill, migrate, verify, and restore in isolation
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.S3_ENDPOINT }}
          R2_BUCKET_NAME: diga-monitor
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
        run: python -m scripts.legacy_history_migration --backfill --execute-r2

      - name: Package verified migration results for the pull-request branch
        run: |
          tar -czf legacy-history-results.tar.gz outputs/changes data/audit/legacy_history_manifest.json data/audit/legacy_retention_report.json

      - name: Upload verified migration results
        uses: actions/upload-artifact@v4
        with:
          name: legacy-history-results-${{ github.run_id }}
          path: legacy-history-results.tar.gz
          if-no-files-found: error
          retention-days: 14
