name: Hotfix newsletter tests

on:
  push:
    branches:
      - hotfix/newsletter-resubscribe

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run subscriber tests
        run: python -m pytest tests/test_subscribers.py -q
