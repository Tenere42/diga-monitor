<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PoC: HTTP Newsletter Signup</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #111827; }
  h1 { font-size: 1.3rem; }
  p.notice { background: #fef9c3; border: 1px solid #eab308; border-radius: 6px; padding: 0.75rem 1rem; font-size: 0.9rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
  input[type="email"] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
  .consent-row { display: flex; align-items: flex-start; gap: 0.5rem; margin-top: 1rem; }
  .consent-row input { margin-top: 0.2rem; }
  .consent-row label { margin: 0; font-weight: 400; font-size: 0.9rem; }
  button { margin-top: 1rem; padding: 0.6rem 1.2rem; font-size: 1rem; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  pre { margin-top: 1rem; padding: 0.75rem; background: #f1f5f9; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>PoC: HTTP Newsletter Signup</h1>
<p class="notice">
  Dies ist ein isolierter technischer Proof of Concept, kein Ersatz für die
  echte Newsletter-Box im DiGA Tracker Dashboard. Nicht für echte Anmeldungen
  gedacht.
</p>

<form id="signup-form">
  <label for="email">E-Mail-Adresse</label>
  <input type="email" id="email" name="email" placeholder="name@beispiel.de" required>

  <div class="consent-row">
    <input type="checkbox" id="consent" name="consent">
    <label for="consent">Ich stimme der (PoC-)Datenschutzerklärung zu.</label>
  </div>

  <button type="submit" id="submit-button">Abonnieren (PoC)</button>
</form>

<pre id="result" hidden></pre>

<script>
const form = document.getElementById("signup-form");
const button = document.getElementById("submit-button");
const resultBox = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const email = document.getElementById("email").value;
  const consent = document.getElementById("consent").checked;

  button.disabled = true;
  button.textContent = "Wird gesendet …";
  resultBox.hidden = true;

  try {
    const response = await fetch("/api/newsletter/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, consent }),
    });
    const body = await response.json();
    resultBox.textContent = `HTTP ${response.status}\n` + JSON.stringify(body, null, 2);
  } catch (err) {
    resultBox.textContent = "Netzwerkfehler: " + err;
  } finally {
    resultBox.hidden = false;
    button.disabled = false;
    button.textContent = "Abonnieren (PoC)";
  }
});
</script>
</body>
</html>
